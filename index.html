<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Referral Lead-Gen Website</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" netlify hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <select name="serviceInterest">
        <option value="virtual_office">Virtual Office</option>
        <option value="meeting_room">Meeting Room</option>
        <option value="serviced_office">Serviced Office</option>
        <option value="general">General Enquiry</option>
      </select>
      <textarea name="message"></textarea>
    </form>
    <form name="enquiry" netlify hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="hidden" name="service-type" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="location" />
      <input type="text" name="mail_handling" />
      <input type="text" name="people_count" />
      <input type="text" name="catering" />
      <input type="text" name="office_size" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
