<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Referral Lead-Gen Website</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" netlify hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <select name="serviceInterest">
        <option value="virtual_office">Virtual Office</option>
        <option value="meeting_room">Meeting Room</option>
        <option value="serviced_office">Serviced Office</option>
        <option value="general">General Enquiry</option>
      </select>
      <select name="urgency">
        <option value="asap">ASAP</option>
        <option value="1_month">Within 1 month</option>
        <option value="3_months">Within 3 months</option>
        <option value="researching">Just researching</option>
      </select>
      <select name="referralSource">
        <option value="google">Google Search</option>
        <option value="social">Social Media</option>
        <option value="recommendation">Recommendation</option>
        <option value="existing_customer">Existing Customer</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message"></textarea>
    </form>
    <form name="enquiry" netlify hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="hidden" name="service-type" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="company" />
      <input type="text" name="location" />
      <select name="urgency">
        <option value="asap">ASAP</option>
        <option value="1_month">Within 1 month</option>
        <option value="3_months">Within 3 months</option>
        <option value="researching">Just researching</option>
      </select>
      <select name="referral_source">
        <option value="google">Google Search</option>
        <option value="social">Social Media</option>
        <option value="recommendation">Recommendation</option>
        <option value="existing_customer">Existing Customer</option>
        <option value="other">Other</option>
      </select>
      <select name="mail_handling">
        <option value="forward">Mail forwarding required</option>
        <option value="collect">Collection only</option>
        <option value="unsure">Not sure yet</option>
      </select>
      <select name="company_status">
        <option value="new">New business</option>
        <option value="existing">Existing business</option>
        <option value="not_incorporated">Not yet incorporated</option>
      </select>
      <select name="people_count">
        <option value="1-4">1-4</option>
        <option value="5-8">5-8</option>
        <option value="9-16">9-16</option>
        <option value="17-30">17-30</option>
        <option value="30+">30+</option>
      </select>
      <select name="catering">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
      <select name="meeting_type">
        <option value="internal">Internal</option>
        <option value="client">Client</option>
        <option value="training">Training</option>
        <option value="interview">Interview</option>
        <option value="workshop_event">Workshop/Event</option>
      </select>
      <select name="duration">
        <option value="1-2hrs">1-2 hrs</option>
        <option value="half_day">Half day</option>
        <option value="full_day">Full day</option>
        <option value="multiple_days">Multiple days</option>
      </select>
      <input type="date" name="preferred_date" />
      <select name="preferred_time">
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
        <option value="full_day">Full Day</option>
        <option value="flexible">Flexible</option>
      </select>
      <select name="office_size">
        <option value="1-2">1-2</option>
        <option value="3-5">3-5</option>
        <option value="6-10">6-10</option>
        <option value="10+">10+</option>
      </select>
      <select name="budget">
        <option value="under_250">Under £250</option>
        <option value="250_500">£250-£500</option>
        <option value="500_1000">£500-£1,000</option>
        <option value="1000_plus">£1,000+</option>
        <option value="unsure">Unsure</option>
      </select>
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
