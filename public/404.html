<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NorthSpace</title>
    <script>
      // GitHub Pages serves 404.html for any path that isn't a real file.
      // Save the original path so the app can restore it after loading.
      sessionStorage.setItem('gh-pages-redirect', window.location.pathname + window.location.search + window.location.hash);
      window.location.replace(window.location.origin + '/');
    </script>
  </head>
  <body></body>
</html>
